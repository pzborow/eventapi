version: '3'
services:
  db:
    image: postgres:9.5
    volumes:
      - data-postgresql-eventapi:/var/lib/postgresql
    environment:
      - POSTGRES_DB=event_api
      - POSTGRES_USER=event_api
      - POSTGRES_PASSWORD=test
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "1"
  web:
    build: images/django_app
#    command: runserver
    command: sleep 99999
    volumes:
      - ./services/django_app:/srv
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - SHELL=/bin/bash
      - PG_HOST=db
      - PG_DATABASE=event_api
      - PG_USER=event_api
      - PG_PASS=test

volumes:
   data-postgresql-eventapi:
     external: true
